aid: keycare
name: KeyCare
description: KeyCare is a telehealth platform that connects health systems to a national
  network of independent, virtual-first care providers through deep Epic EHR integration.
  Built on Epic using CareEverywhere, MyChart, Telehealth Anywhere, and Book Anywhere
  workflows, KeyCare lets member health systems extend their own Epic instance to on-demand
  urgent care (24/7/365 across all 50 states), behavioral health, neurology, primary
  care, and expanding specialties such as rheumatology, cardiology, and maternal care.
  The company serves health systems including Allina Health, Memorial Healthcare, Ochsner
  Health, WellSpan, and Confluence Health. KeyCare is backed by 8VC. This profile has
  no public API or developer surface at the time of enrichment.
